basePath: /
definitions:
  github_com_planeweave_planeweave_internal_domain.AuthResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/github_com_planeweave_planeweave_internal_domain.User'
    type: object
  github_com_planeweave_planeweave_internal_domain.Dependency:
    properties:
      fromTaskId:
        type: string
      id:
        type: string
      projectId:
        type: string
      toTaskId:
        type: string
    type: object
  github_com_planeweave_planeweave_internal_domain.Project:
    properties:
      createdAt:
        type: string
      id:
        type: string
      ownerId:
        type: string
      title:
        type: string
    type: object
  github_com_planeweave_planeweave_internal_domain.ProjectMember:
    properties:
      displayName:
        type: string
      email:
        type: string
      role:
        type: string
      userId:
        type: string
    type: object
  github_com_planeweave_planeweave_internal_domain.Task:
    properties:
      assigneeId:
        type: string
      id:
        type: string
      projectId:
        type: string
      status:
        type: string
      title:
        type: string
      updatedAt:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
  github_com_planeweave_planeweave_internal_domain.User:
    properties:
      displayName:
        type: string
      email:
        type: string
      id:
        type: string
    type: object
  internal_handler.ErrorResponse:
    properties:
      error:
        example: invalid_request
        type: string
    type: object
  internal_handler.InviteResponse:
    properties:
      expiresAt:
        type: string
      token:
        example: a1b2c3
        type: string
    type: object
  internal_handler.createDependencyRequest:
    properties:
      fromTaskId:
        example: uuid-from
        type: string
      toTaskId:
        example: uuid-to
        type: string
    type: object
  internal_handler.createTaskRequest:
    properties:
      assigneeId:
        type: string
      status:
        example: todo
        type: string
      title:
        example: Задача A
        type: string
      x:
        example: 100
        type: number
      "y":
        example: 100
        type: number
    type: object
  internal_handler.loginRequest:
    properties:
      email:
        example: student@test.com
        type: string
      password:
        example: password1
        type: string
    type: object
  internal_handler.patchTaskRequest:
    properties:
      assigneeId:
        type: string
      status:
        type: string
      title:
        type: string
      x:
        type: number
      "y":
        type: number
    type: object
  internal_handler.registerRequest:
    properties:
      displayName:
        example: Студент
        type: string
      email:
        example: student@test.com
        type: string
      password:
        example: password1
        type: string
    type: object
  internal_handler.titleRequest:
    properties:
      title:
        example: Мой проект
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: |-
    REST API командной доски задач с графом зависимостей.
    WebSocket (синхронизация): см. backend/docs/websocket.md
  title: Planeweave API
  version: "1.0"
